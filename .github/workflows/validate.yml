name: Build and validate Cesium integration
on:
  push:
    branches: [main, 'rework/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install aiohttp "PyYAML>=6,<7"
      - run: npm run build
      - run: npm test && npm run test:python
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: weltlage-hacs-review-package
          path: weltlage.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-qa
          path: tests/artifacts/
