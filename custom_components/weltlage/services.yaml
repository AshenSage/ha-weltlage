fetch_intel:
  name: Globus-Daten laden
  description: Legacy-Aufruf: begrenzten Backend-Cache für Flüge, Satelliten oder Fintraffic füllen. Ergebnisse erscheinen ausschliesslich in der Globuskarte, nicht in Sensorattributen.
  fields:
    kind:
      required: true
      selector:
        select:
          options:
            - flights
            - satellites
            - cameras
    latitude:
      selector:
        number:
          min: -90
          max: 90
          mode: box
    longitude:
      selector:
        number:
          min: -180
          max: 180
          mode: box
    provider:
      description: Legacy-Auswahl: nur finland wird noch unterstützt. Öffentliche Windy-Webcams direkt in der Karte laden.
      selector:
        select:
          options:
            - london
            - finland
            - bc
