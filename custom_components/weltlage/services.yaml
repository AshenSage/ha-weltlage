fetch_intel:
  name: Globus-Daten laden
  description: Öffentliche Flugkontakte im gewählten Ausschnitt, Satelliten-Bahndaten oder offizielle Kamerakataloge laden. Flüge maximal einmal pro Minute, Bahndaten einmal pro zwei Stunden.
  fields:
    kind:
      required: true
      selector:
        select:
          options:
            - flights
            - satellites
            - cameras
    latitude:
      selector:
        number:
          min: -90
          max: 90
          mode: box
    longitude:
      selector:
        number:
          min: -180
          max: 180
          mode: box
    provider:
      description: Kameranetz (nur bei kind cameras). Katalog maximal einmal pro Stunde, nach Fehlern erneut nach einer Minute.
      selector:
        select:
          options:
            - london
            - finland
            - bc
